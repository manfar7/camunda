steps:
  # Get latest stable tag from Docker Hub
  - name: 'gcr.io/cloud-builders/curl'
    id: get-tag
    entrypoint: bash
    args:
      - -c
      - |
        apt-get update -qq && apt-get install -y -qq python3 > /dev/null 2>&1
        LATEST=$(curl -s "https://hub.docker.com/v2/repositories/camunda/camunda/tags/?page_size=50&ordering=last_updated" \
          | python3 -c "
        import sys, json, re
        tags = json.load(sys.stdin)['results']
        stable = [t['name'] for t in tags if re.match(r'^8\.\d+\.\d+$', t['name'])]
        print(sorted(stable, key=lambda v: list(map(int, v.split('.'))), reverse=True)[0])
        ")
        echo "Latest stable tag: $LATEST"
        echo "$LATEST" > /workspace/latest_tag.txt

  # Pull pre-built image from Docker Hub, tag for Artifact Registry, and push
  - name: 'gcr.io/cloud-builders/docker'
    id: pull-tag-push
    entrypoint: bash
    args:
      - -c
      - |
        TAG=$(cat /workspace/latest_tag.txt)
        IMAGE="$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME"
        echo "Pulling docker.io/camunda/camunda:$TAG"
        docker pull "docker.io/camunda/camunda:$TAG"
        docker tag "docker.io/camunda/camunda:$TAG" "$IMAGE:$TAG"
        docker tag "docker.io/camunda/camunda:$TAG" "$IMAGE:latest"
        docker push "$IMAGE:$TAG"
        docker push "$IMAGE:latest"

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    id: deploy
    entrypoint: bash
    args:
      - -c
      - |
        TAG=$(cat /workspace/latest_tag.txt)
        IMAGE="$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME"
        gcloud run services update $_SERVICE_NAME \
          --platform=managed \
          --image="$IMAGE:$TAG" \
          --region=$_DEPLOY_REGION \
          --quiet

substitutions:
  _AR_HOSTNAME: europe-west6-docker.pkg.dev
  _AR_PROJECT_ID: cosa-camunda-01
  _AR_REPOSITORY: cloud-run-source-deploy
  _DEPLOY_REGION: europe-west6
  _SERVICE_NAME: camunda

options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: ALLOW_LOOSE

timeout: 1200s
