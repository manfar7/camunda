steps:
  # Build the Docker image with BuildKit enabled
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - -c
      - |
        export DOCKER_BUILDKIT=1
        docker build \
          -f camunda.Dockerfile \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/camunda/camunda:${SHORT_SHA} \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/camunda/camunda:latest \
          .
    timeout: 1800s

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/camunda/camunda']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - gcloud
      - run
      - deploy
      - camunda
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/camunda/camunda:${SHORT_SHA}
      - --port=8080
      - --memory=4Gi
      - --cpu=2
      - --no-cpu-throttling
      - --min-instances=1
      - --max-instances=1
      - --region=${_REGION}
      - --allow-unauthenticated

substitutions:
  _REGION: us-central1

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/camunda/camunda'

timeout: 2400s
